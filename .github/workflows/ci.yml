---
name: CI
'on':
  pull_request:
  push:
    branches:
      - main

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies.
        run: pip3 install ansible-lint

      - name: Install required collections.
        run: ansible-galaxy collection install ansible.windows

      - name: Lint code.
        run: ansible-lint --profile production

      - name: Make the role resolvable by its Galaxy name.
        run: mkdir -p .ansible/roles && ln -sfn "$PWD" .ansible/roles/deekayen.win_updates

      - name: Syntax check.
        run: ansible-playbook --syntax-check tests/test.yml -i tests/inventory
        env:
          ANSIBLE_ROLES_PATH: .ansible/roles:~/.ansible/roles
